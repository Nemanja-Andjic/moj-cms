{% extends "base.html" %}

{% block naslov %}Preimenuj kategoriju – {% endblock %}

{% block sadrzaj %}
  <p><a href="{{ url_for('admin.kategorije') }}">← Kategorije</a></p>
  <h1>Preimenuj kategoriju {{ kategorija.ime }}</h1>

  {% if greska %}
    <p class="greska" role="alert">{{ greska }}</p>
  {% endif %}

  <form method="post">
    <label>
      Novo ime
      <input name="ime" value="{{ ime }}" required autofocus>
    </label>
    <button type="submit">Sačuvaj</button>
  </form>
{% endblock %}
